        <div class="text-center text-2xl font-bold "> <h1>Register </h1> </div> <div class="text-center "><span class="text-base "> please Fill Your informations to Continue </span></div> <br>
    
    
    <form action="register_process.php" method="POST">
        <div class=" flex flex-col gap-1 w-auto ml-2 font-normal">
       Name <input class="  border-b-2  focus:outline-none border-black  placeholder:text-sm placeholder:hover:text-xs placeholder:p-2  "  type="text" name="name" placeholder="Enter Your name"  >

</div>
       <input type="checkbox"> I agree on terms & conditions <br><br>
<div class="bg-gray-900 text-slate-200 text-center rounded-md p-1.5 w-44 relative left-20 hover:bg-gray-800"><button type="submit">Register</button></form></div>

</div></div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var cb = document.querySelector('input[type="checkbox"]');
    var btn = document.querySelector('button[type="submit"]');
    if (cb && btn) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
        btn.style.cursor = 'not-allowed';
        cb.addEventListener('change', function() {
            btn.disabled = !cb.checked;
            btn.style.opacity = cb.checked ? '1' : '0.5';
            btn.style.cursor = cb.checked ? 'pointer' : 'not-allowed';
        });
    }
});
</script>
